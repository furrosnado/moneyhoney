/* ============ exportar planilha (.xlsx sem dependências) ============
   Gera um .xlsx de verdade (ZIP + XML OOXML) escrito à mão — mesma filosofia do resto do app
   (fonte embutida, gráfico SVG à mão): zero lib, zero CDN. Método de zip STORE (sem compressão):
   mais simples e robusto que implementar DEFLATE; o arquivo é pequeno o bastante pra não importar. */
function xlCrc32(bytes){
  let crc=~0;
  for(let i=0;i<bytes.length;i++){
    crc^=bytes[i];
    for(let j=0;j<8;j++)crc=(crc>>>1)^(0xEDB88320&-(crc&1));
  }
  return(~crc)>>>0;
}
function xlU16(n){return[n&0xFF,(n>>>8)&0xFF];}
function xlU32(n){return[n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF];}
function xlDosDateTime(){
  const d=new Date();
  const time=((d.getHours()&0x1F)<<11)|((d.getMinutes()&0x3F)<<5)|(Math.floor(d.getSeconds()/2)&0x1F);
  const date=(((d.getFullYear()-1980)&0x7F)<<9)|(((d.getMonth()+1)&0xF)<<5)|(d.getDate()&0x1F);
  return{time,date};
}
function xlZipBuild(files){ // files:[{name,bytes:Uint8Array}] -> Uint8Array (zip STORE, sem compressão)
  const{time,date}=xlDosDateTime();
  const out=[],central=[];let offset=0;
  for(const f of files){
    const nameBytes=[];for(let i=0;i<f.name.length;i++)nameBytes.push(f.name.charCodeAt(i));
    const crc=xlCrc32(f.bytes),size=f.bytes.length;
    const head=[...xlU32(0x04034b50),...xlU16(20),...xlU16(0),...xlU16(0),
      ...xlU16(time),...xlU16(date),...xlU32(crc),...xlU32(size),...xlU32(size),
      ...xlU16(nameBytes.length),...xlU16(0),...nameBytes];
    for(const b of head)out.push(b);
    for(let i=0;i<f.bytes.length;i++)out.push(f.bytes[i]);
    central.push({nameBytes,crc,size,offset});
    offset+=head.length+f.bytes.length;
  }
  const cdStart=offset,cd=[];
  for(const e of central){
    const rec=[...xlU32(0x02014b50),...xlU16(20),...xlU16(20),...xlU16(0),...xlU16(0),
      ...xlU16(time),...xlU16(date),...xlU32(e.crc),...xlU32(e.size),...xlU32(e.size),
      ...xlU16(e.nameBytes.length),...xlU16(0),...xlU16(0),...xlU16(0),...xlU16(0),...xlU32(0),
      ...xlU32(e.offset),...e.nameBytes];
    for(const b of rec)cd.push(b);
  }
  const eocd=[...xlU32(0x06054b50),...xlU16(0),...xlU16(0),
    ...xlU16(central.length),...xlU16(central.length),
    ...xlU32(cd.length),...xlU32(cdStart),...xlU16(0)];
  return new Uint8Array([...out,...cd,...eocd]);
}
function xlColLetter(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
const xlR2=n=>Math.round((n||0)*100)/100;

// registro de estilos: dedupe por conteúdo (não por identidade do objeto) — cada chamada de xf()
// devolve o índice existente se já pediram essa combinação, ou cria uma nova entrada.
function xlStyleReg(){
  const fonts=[{name:'Calibri',sz:11}]; // índice 0 = default (obrigatório pelo spec OOXML)
  const fills=[{},{}]; // índices 0/1 = none/gray125 (obrigatórios pelo spec)
  const numFmts=[]; // ids custom a partir de 164 (0-163 são reservados/built-in)
  const xfs=[{fontId:0,fillId:0,numFmtId:0,borderId:0,align:null,wrap:false}]; // índice 0 = default
  const find=(arr,pred)=>{for(let i=0;i<arr.length;i++)if(pred(arr[i]))return i;return-1;};
  function fontId(f){
    let i=find(fonts,x=>x.name===f.name&&x.sz===f.sz&&!!x.b===!!f.b&&x.color===f.color);
    if(i<0){i=fonts.length;fonts.push(f);}return i;
  }
  function fillId(color){
    if(!color)return 0;
    let i=find(fills,x=>x.color===color);
    if(i<0){i=fills.length;fills.push({color});}return i;
  }
  function numFmtId(code){
    if(!code)return 0;
    let e=numFmts.find(x=>x.code===code);
    if(!e){e={id:164+numFmts.length,code};numFmts.push(e);}return e.id;
  }
  function xf(o){
    const fId=fontId(o.font||{name:'Manrope',sz:10.5});
    const flId=fillId(o.fill);
    const nfId=numFmtId(o.numFmt);
    const bId=o.border?1:0;
    const align=o.align||null,wrap=!!o.wrap;
    let i=find(xfs,x=>x.fontId===fId&&x.fillId===flId&&x.numFmtId===nfId&&x.borderId===bId&&x.align===align&&x.wrap===wrap);
    if(i<0){i=xfs.length;xfs.push({fontId:fId,fillId:flId,numFmtId:nfId,borderId:bId,align,wrap});}
    return i;
  }
  return{fonts,fills,numFmts,xfs,xf};
}
function xlStylesXml(SR){
  const numFmtsXml=SR.numFmts.length?`<numFmts count="${SR.numFmts.length}">${SR.numFmts.map(f=>`<numFmt numFmtId="${f.id}" formatCode="${esc(f.code)}"/>`).join('')}</numFmts>`:'';
  const fontsXml=SR.fonts.map(f=>`<font><sz val="${f.sz}"/>${f.color?`<color rgb="${f.color}"/>`:''}<name val="${esc(f.name)}"/>${f.b?'<b/>':''}</font>`).join('');
  const fillsXml=SR.fills.map((f,i)=>{
    if(i===0)return'<fill><patternFill patternType="none"/></fill>';
    if(i===1)return'<fill><patternFill patternType="gray125"/></fill>';
    return`<fill><patternFill patternType="solid"><fgColor rgb="${f.color}"/><bgColor indexed="64"/></patternFill></fill>`;
  }).join('');
  const xfsXml=SR.xfs.map(x=>{
    const attrs=`numFmtId="${x.numFmtId}" fontId="${x.fontId}" fillId="${x.fillId}" borderId="${x.borderId}" xfId="0"`+
      (x.numFmtId?' applyNumberFormat="1"':'')+(x.fillId?' applyFill="1"':'')+(x.fontId?' applyFont="1"':'')+
      (x.align||x.wrap?' applyAlignment="1"':'');
    if(x.align||x.wrap)return`<xf ${attrs}><alignment${x.align?` horizontal="${x.align}"`:''} vertical="center"${x.wrap?' wrapText="1"':''}/></xf>`;
    return`<xf ${attrs}/>`;
  }).join('');
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
${numFmtsXml}<fonts count="${SR.fonts.length}">${fontsXml}</fonts>
<fills count="${SR.fills.length}">${fillsXml}</fills>
<borders count="1"><border/></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${SR.xfs.length}">${xfsXml}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
}
function xlSheetXml(sheet){ // sheet:{cols:[{w}],rows:[{idx,cells:[{v,f,style}|null,...]}],freeze?,autofilter?}
  const colsXml=sheet.cols&&sheet.cols.length?`<cols>${sheet.cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w}" customWidth="1"/>`).join('')}</cols>`:'';
  const rowsXml=sheet.rows.map(r=>{
    let cellsXml='';
    for(let i=0;i<r.cells.length;i++){
      const cell=r.cells[i];if(cell==null)continue;
      const ref=xlColLetter(i+1)+r.idx;
      const sAttr=cell.style!=null?` s="${cell.style}"`:'';
      if(cell.f!=null){
        const vTag=cell.v!=null?`<v>${cell.v}</v>`:'';
        cellsXml+=`<c r="${ref}"${sAttr}><f>${esc(cell.f)}</f>${vTag}</c>`;
      }else if(typeof cell.v==='number'){
        cellsXml+=`<c r="${ref}"${sAttr}><v>${cell.v}</v></c>`;
      }else if(cell.v!=null&&cell.v!==''){
        cellsXml+=`<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${esc(cell.v)}</t></is></c>`;
      }else if(sAttr){
        cellsXml+=`<c r="${ref}"${sAttr}/>`; // célula vazia só pra herdar o preenchimento (fundo de seção)
      }
    }
    const hAttr=r.h?` ht="${r.h}" customHeight="1"`:'';
    return`<row r="${r.idx}"${hAttr}>${cellsXml}</row>`;
  }).join('');
  const viewsXml=sheet.freeze?`<sheetViews><sheetView workbookViewId="0"><pane ySplit="${sheet.freeze}" topLeftCell="A${sheet.freeze+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews>`:'<sheetViews><sheetView workbookViewId="0"/></sheetViews>';
  const filterXml=sheet.autofilter?`<autoFilter ref="${sheet.autofilter}"/>`:'';
  const mergesXml=sheet.merges&&sheet.merges.length?`<mergeCells count="${sheet.merges.length}">${sheet.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:'';
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
${viewsXml}${colsXml}<sheetData>${rowsXml}</sheetData>${filterXml}${mergesXml}
</worksheet>`;
}

const XLMESABR=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const xlMShort=k=>{const[y,m]=k.split('-');return XLMESABR[+m-1]+'/'+y;}; // "Jul/2026" — estilo aprovado pro backup (mês/ano cheio, diferente do mshort() de 2 dígitos usado no resto do app)

/* ---------- monta os dados (reaproveita calcAcc/calcMonth — mesma verdade da dashboard) ---------- */
function xlBuildWorkbook(months){
  const SR=xlStyleReg(),S_=o=>SR.xf(o);
  const CUR='"R$ "#,##0.00';
  const ST={
    title:{font:{name:'Manrope',sz:15,b:true}},
    sub:{font:{name:'Manrope',sz:9,color:'FF808080'},align:'left'},
    subwrap:{font:{name:'Manrope',sz:9,color:'FF808080'},align:'left',wrap:true},
    section:{font:{name:'Manrope',sz:10,b:true,color:'FF4A4A4A'},fill:'FFEDEDED',align:'left'},
    head:{font:{name:'Manrope',sz:10,b:true,color:'FFFFFFFF'},fill:'FF3D3D3D',align:'left'},
    lbl:{font:{name:'Manrope',sz:10},align:'left'},
    lblb:{font:{name:'Manrope',sz:10,b:true},align:'left'},
    num:{font:{name:'Manrope',sz:10},align:'right'},
    val:{font:{name:'Manrope',sz:10},numFmt:CUR,align:'right'},
    valb:{font:{name:'Manrope',sz:10,b:true},numFmt:CUR,align:'right'},
    pos:{font:{name:'Manrope',sz:10,color:'FF1F7A4D'},numFmt:CUR,align:'right'},
    neg:{font:{name:'Manrope',sz:10,color:'FFC0392B'},numFmt:CUR,align:'right'},
    hero:{font:{name:'Manrope',sz:16},numFmt:CUR,align:'right'}
  };
  const ZFILL='FFF7F7F7',TFILL='FFE7EFE9';
  const z=(st,on)=>on?{...st,fill:ZFILL}:st;
  const accName=id=>{const a=S.accounts.find(x=>x.id===id);return a?a.name:'?';};
  const cardNm=id=>{const c=S.cards.find(x=>x.id===id);return c?c.name:'?';};
  const curK=todayKey();
  const mkFrom=months[0],mkTo=months[months.length-1];
  const single=mkFrom===mkTo;
  const rangeLabel=single?xlMShort(mkFrom):`${xlMShort(mkFrom)} a ${xlMShort(mkTo)}`;
  const now=new Date(),dataExport=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();

  /* ---------- RESUMO ---------- */
  const rRows=[],rCols=[{w:50.7},{w:28.6},{w:14},{w:15},{w:14},{w:15}];
  let ri=1;
  rRows.push({idx:ri,h:30,cells:[{v:'Sistema Financeiro · Backup',style:S_(ST.title)}]});ri++;
  const subLbl=single?`Mês de referência: ${rangeLabel}`:`Período: ${rangeLabel}`;
  rRows.push({idx:ri,h:18,cells:[{v:`${subLbl}    ·    retrato do backup de ${dataExport}`,style:S_(ST.sub)}]});ri+=2;
  const secRow=label=>{const cells=[];for(let c=0;c<6;c++)cells[c]={style:S_(ST.section)};cells[0]={v:label,style:S_(ST.section)};rRows.push({idx:ri,h:21.8,cells});ri++;};

  secRow(single?'COMO O MÊS FECHA':'COMO O PERÍODO FECHA');
  const heroRow={idx:ri,h:23.2,cells:[{v:single?'Fecha o mês · sem o caixa':'Fecha o período · sem o caixa',style:S_(ST.lbl)},{style:S_(ST.hero)}]};
  rRows.push(heroRow);ri+=2;

  secRow('SALDO POR CONTA · '+rangeLabel.toUpperCase());
  rRows.push({idx:ri,h:25.5,cells:['Conta','Abre','Entradas','Saídas','Transf.','Fecha'].map(v=>({v,style:S_(ST.head)}))});ri++;
  let semCaixaTotal=0;
  for(const a of S.accounts){
    const aid=a.id,openC=calcAcc(mkFrom,aid);
    let inn=0,out=0,tin=0,tout=0;
    for(const mk of months){const c=calcAcc(mk,aid);inn+=c.inn;out+=c.out;tin+=c.tin;tout+=c.tout;}
    const closeVal=calcAcc(mkTo,aid).close; // valor direto do app (correto mesmo com opening editado manualmente no meio do período)
    if(!a.cash)semCaixaTotal+=closeVal;
    rRows.push({idx:ri,h:21,cells:[
      {v:a.name+(a.cash?'  · caixa':''),style:S_(ST.lbl)},
      {v:xlR2(openC.open),style:S_(ST.val)},
      {v:xlR2(inn),style:S_(ST.val)},
      {v:xlR2(out),style:S_(ST.val)},
      {v:xlR2(tin-tout),style:S_(ST.val)},
      {v:xlR2(closeVal),style:S_(ST.valb)}
    ]});ri++;
  }
  const totIdx=ri;
  rRows.push({idx:ri,h:21,cells:[
    {v:'Total · Sem o caixa',style:S_({...ST.lblb,fill:TFILL})},
    {style:S_({font:ST.lbl.font,fill:TFILL})},{style:S_({font:ST.lbl.font,fill:TFILL})},
    {style:S_({font:ST.lbl.font,fill:TFILL})},{style:S_({font:ST.lbl.font,fill:TFILL})},
    {v:xlR2(semCaixaTotal),style:S_({...ST.valb,fill:TFILL})}
  ]});ri+=2;
  heroRow.cells[1]={f:`F${totIdx}`,v:xlR2(semCaixaTotal),style:S_(ST.hero)}; // headline espelha o total (mesma aba)

  secRow('DÍVIDAS');
  const debts=S.debts||[];
  const DTOT=debts.length+2; // resolvido depois de montar a aba Dívidas (mesma contagem)
  rRows.push({idx:ri,h:21,cells:[{v:'Compromisso mensal (parcelas ativas)',style:S_(ST.lbl)},{f:`'Dívidas'!B${DTOT}`,v:xlR2(debts.filter(d=>d.total-d.pagas>0).reduce((s,d)=>s+d.parcela,0)),style:S_(ST.neg)}]});ri++;
  rRows.push({idx:ri,h:21,cells:[{v:'Falta pagar (todas as parcelas restantes)',style:S_(ST.lbl)},{f:`'Dívidas'!F${DTOT}`,v:xlR2(debts.reduce((s,d)=>s+Math.max(0,d.total-d.pagas)*d.parcela,0)),style:S_(ST.neg)}]});ri+=2;

  const sav=S.savings||[];
  if(sav.length){
    secRow('CAIXINHAS');
    for(const sv of sav){
      let alvo='';
      if(sv.target){alvo=`  ·  meta R$ ${Math.round(sv.target).toLocaleString('pt-BR')}`;if(sv.deadline)alvo+=` até ${xlMShort(sv.deadline)}`;}
      rRows.push({idx:ri,h:21,cells:[{v:sv.name+alvo,style:S_(ST.lbl)},{v:xlR2(sv.balance||0),style:S_(ST.val)}]});ri++;
    }
    ri++;
  }
  const notaDividas=single?'':' (Dívidas reflete o estado atual, não o período exportado)';
  rRows.push({idx:ri,h:45.8,cells:[{v:`As Saídas por conta já incluem faturas de cartão e parcelas no orçamento. O detalhe de cada compra está na aba Lançamentos; os parcelamentos, na aba Dívidas${notaDividas}. Este arquivo é um retrato de segurança — o app continua sendo a fonte da verdade.`,style:S_(ST.subwrap)}]});
  const rSheet={cols:rCols,rows:rRows,merges:[`A${ri}:F${ri}`]};

  /* ---------- LANÇAMENTOS ---------- */
  const lRows=[{idx:1,h:25.5,cells:['Mês','Onde','Grupo','Descrição','Valor (R$)','Tipo','Categoria','Pago','Dia','Recorrente','Obs'].map(v=>({v,style:S_(ST.head)}))}];
  let li=2;
  for(const mk of months){
    const m=S.months[mk],gt={};for(const g of m.groups)gt[g.id]=g;
    for(const it of m.items){
      if(it.cardId||it.debtId)continue; // derivados (fatura/parcela) — evita dupla contagem, ver Dívidas/Cartões
      const g=gt[it.g]||{},isIn=g.type==='in',zb=li%2===0;
      lRows.push({idx:li,h:21,cells:[
        {v:xlMShort(mk),style:S_(z(ST.lbl,zb))},{v:accName(g.acc),style:S_(z(ST.lbl,zb))},
        {v:g.name||'',style:S_(z(ST.lbl,zb))},{v:it.label,style:S_(z(ST.lbl,zb))},
        {v:xlR2(it.val),style:S_(z(isIn?ST.pos:ST.neg,zb))},{v:isIn?'Entrada':'Saída',style:S_(z(ST.lbl,zb))},
        {v:it.cat||'',style:S_(z(ST.lbl,zb))},{v:it.paid?'Sim':'Não',style:S_(z(ST.lbl,zb))},
        {v:it.d||'',style:S_(z(ST.lbl,zb))},{v:it.recurring?'Sim':'Não',style:S_(z(ST.lbl,zb))},
        {v:it.person||'',style:S_(z(ST.lbl,zb))}
      ]});li++;
    }
    for(const e of(m.cardExp||[])){
      const val=e.est?-e.val:e.val,zb=li%2===0;
      lRows.push({idx:li,h:21,cells:[
        {v:xlMShort(mk),style:S_(z(ST.lbl,zb))},{v:cardNm(e.cardId),style:S_(z(ST.lbl,zb))},
        {v:'Cartão (avulso)',style:S_(z(ST.lbl,zb))},{v:e.label,style:S_(z(ST.lbl,zb))},
        {v:xlR2(val),style:S_(z(ST.neg,zb))},{v:'Saída',style:S_(z(ST.lbl,zb))},
        {v:e.cat||'',style:S_(z(ST.lbl,zb))},{v:'',style:S_(z(ST.lbl,zb))},
        {v:e.d||'',style:S_(z(ST.lbl,zb))},{v:e.rec?'Sim':'Não',style:S_(z(ST.lbl,zb))},
        {v:e.est?'Estorno':'',style:S_(z(ST.lbl,zb))}
      ]});li++;
    }
    for(const t of(m.transfers||[])){
      const zb=li%2===0;
      lRows.push({idx:li,h:21,cells:[
        {v:xlMShort(mk),style:S_(z(ST.lbl,zb))},{v:accName(t.from),style:S_(z(ST.lbl,zb))},
        {v:'Transferência',style:S_(z(ST.lbl,zb))},{v:`${accName(t.from)} → ${accName(t.to)}`,style:S_(z(ST.lbl,zb))},
        {v:xlR2(t.val),style:S_(z(ST.val,zb))},{v:'Transferência',style:S_(z(ST.lbl,zb))},
        {v:'',style:S_(z(ST.lbl,zb))},{v:t.done?'Sim':'Não',style:S_(z(ST.lbl,zb))},
        {v:'',style:S_(z(ST.lbl,zb))},{v:t.rec?'Sim':'Não',style:S_(z(ST.lbl,zb))},{v:'',style:S_(z(ST.lbl,zb))}
      ]});li++;
    }
  }
  const lSheet={cols:[10,17,22,32,13,14,17,8,6,12,16].map(w=>({w})),rows:lRows,freeze:1,autofilter:`A1:K${li-1}`};

  /* ---------- DÍVIDAS ---------- */
  const dRows=[{idx:1,h:25.5,cells:['Dívida','Parcela (R$)','Pagas','Total','Restantes','Falta pagar (R$)','Onde','Termina em'].map(v=>({v,style:S_(ST.head)}))}];
  let di=2;
  for(const d of debts){
    const zb=di%2===0;
    const onde=d.card?brandName(d.card):(d.budget?('Orçamento · '+accName(d.account)):'—');
    const rest=Math.max(0,d.total-d.pagas);
    const fim=rest>0?xlMShort(addM(curK,rest-1)):'quitada';
    dRows.push({idx:di,h:21,cells:[
      {v:d.name,style:S_(z(ST.lbl,zb))},{v:xlR2(d.parcela),style:S_(z(ST.val,zb))},
      {v:d.pagas,style:S_(z(ST.num,zb))},{v:d.total,style:S_(z(ST.num,zb))},
      {f:`D${di}-C${di}`,v:rest,style:S_(z(ST.num,zb))},
      {f:`E${di}*B${di}`,v:xlR2(rest*d.parcela),style:S_(z(ST.val,zb))},
      {v:onde,style:S_(z(ST.lbl,zb))},{v:fim,style:S_(z(ST.lbl,zb))}
    ]});di++;
  }
  // sem dívidas, di===2: SUMIF(E2:E1,...)/SUM(F2:F1) seriam ranges invertidos que Excel/Sheets normalizam
  // INCLUINDO a própria célula do total (B2/F2) → referência circular / #REF! e o erro propaga pro Resumo.
  // Nesse caso emite o total como valor literal (0); com dívidas, mantém a fórmula viva.
  const hasDebts=debts.length>0;
  const compVal=xlR2(debts.filter(d=>d.total-d.pagas>0).reduce((s,d)=>s+d.parcela,0));
  const faltaVal=xlR2(debts.reduce((s,d)=>s+Math.max(0,d.total-d.pagas)*d.parcela,0));
  const totalRow=[
    {v:'TOTAL (parcelas ativas)',style:S_({...ST.lblb,fill:TFILL})},
    hasDebts?{f:`SUMIF(E2:E${di-1},">0",B2:B${di-1})`,v:compVal,style:S_({...ST.valb,fill:TFILL})}:{v:compVal,style:S_({...ST.valb,fill:TFILL})},
    {style:S_({font:ST.lbl.font,fill:TFILL})},{style:S_({font:ST.lbl.font,fill:TFILL})},{style:S_({font:ST.lbl.font,fill:TFILL})},
    hasDebts?{f:`SUM(F2:F${di-1})`,v:faltaVal,style:S_({...ST.valb,fill:TFILL})}:{v:faltaVal,style:S_({...ST.valb,fill:TFILL})},
    {style:S_({font:ST.lbl.font,fill:TFILL})},{style:S_({font:ST.lbl.font,fill:TFILL})}
  ];
  dRows.push({idx:di,h:21,cells:totalRow});
  const dSheet={cols:[28,14,9,9,12,16,24.7,13].map(w=>({w})),rows:dRows,freeze:1};

  const enc=new TextEncoder();
  const files=[
    {name:'[Content_Types].xml',bytes:enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/worksheets/sheet3.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`)},
    {name:'_rels/.rels',bytes:enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)},
    {name:'xl/workbook.xml',bytes:enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>
<sheet name="Resumo" sheetId="1" r:id="rId1"/>
<sheet name="Lançamentos" sheetId="2" r:id="rId2"/>
<sheet name="Dívidas" sheetId="3" r:id="rId3"/>
</sheets>
</workbook>`)},
    {name:'xl/_rels/workbook.xml.rels',bytes:enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>
<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/>
<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`)},
    {name:'xl/styles.xml',bytes:enc.encode(xlStylesXml(SR))},
    {name:'xl/worksheets/sheet1.xml',bytes:enc.encode(xlSheetXml(rSheet))},
    {name:'xl/worksheets/sheet2.xml',bytes:enc.encode(xlSheetXml(lSheet))},
    {name:'xl/worksheets/sheet3.xml',bytes:enc.encode(xlSheetXml(dSheet))}
  ];
  return xlZipBuild(files);
}

/* ---------- seletor de período (Ferramentas) ---------- */
let xlPreset='mes',xlFrom=null,xlTo=null; // volátil por sessão, como dashProj/dashHist
function xlAvailMonths(){return monthKeys().filter(k=>k<=todayKey());} // nunca exporta projeção futura
function xlMonthsInRange(){
  const avail=xlAvailMonths();if(!avail.length)return[];
  const curK=todayKey(),y=+curK.slice(0,4);
  let from,to;
  if(xlPreset==='mes'){from=curK;to=curK;}
  else if(xlPreset==='ano'){from=y+'-01';to=curK;}
  else if(xlPreset==='anopass'){from=(y-1)+'-01';to=(y-1)+'-12';}
  else{from=xlFrom||avail[0];to=xlTo||avail[avail.length-1];}
  if(from>to)[from,to]=[to,from]; // personalizado invertido por engano: troca em vez de dar vazio
  return avail.filter(k=>k>=from&&k<=to);
}
function xlRangeText(months){return months.length?`${months.length} mês${months.length>1?'es':''} · ${mlabel(months[0])}${months.length>1?' a '+mlabel(months[months.length-1]):''}`:'Nenhum mês encontrado nesse período.';}
function xlRefreshRange(){ // atualiza o texto do período e o botão IN-PLACE, sem render(): os selects de/até são pickers e no iOS a roleta dispara change no meio do gesto — um render() destruiria o <select> aberto (mesma lei do tfrom/tto)

  const r=document.querySelector('.xlrange');if(r)r.textContent=xlRangeText(months);
  const b=document.querySelector('[data-act="xldown"]');if(b)b.disabled=!months.length;
}

/* ============ novo mês ============ */
function newMonth(){
  const keys=monthKeys(),last=keys[keys.length-1],nk=addM(last,1);
  if(S.months[nk])return;
  if(!confirm(`Criar ${mlabel(nk)}?\n\nSaldos iniciais virão do fechamento de ${mlabel(last)} (real, se informado; senão o projetado) e acompanham até você editá-los. Itens marcados como recorrentes ↻ serão copiados.`))return;
  S.activeMonth=spawnMonth(last);save();render();
}

/* ============ eventos (delegação) ============ */
function findItem(id){return S.months[S.activeMonth].items.find(i=>i.id===id);}
function findTransfer(id){return S.months[S.activeMonth].transfers.find(t=>t.id===id);}

document.getElementById('subtitle').addEventListener('input',e=>{S.subtitle=e.target.value;save();});

document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){S.tab=t.dataset.tab;save();render();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const keys=monthKeys(),ix=keys.indexOf(S.activeMonth);
  if(b.dataset.act==='mprev'&&ix>0){S.activeMonth=keys[ix-1];save();render();}
  else if(b.dataset.act==='mnext'&&ix<keys.length-1){S.activeMonth=keys[ix+1];save();render();}
  else if(b.dataset.act==='newmonth')newMonth();
  else if(b.dataset.act==='focoff'){S.focusProj=null;save();render();}
});

document.getElementById('qladdbtn').addEventListener('click',e=>{openQuickAdd(e.currentTarget);});
document.getElementById('hambbtn').addEventListener('click',e=>{tabsTrayEl?closeTabsTray():openTabsTray(e.currentTarget);});

let dragP=null;
view.addEventListener('pointerdown',e=>{
  const h=e.target.closest?e.target.closest('.dragh'):null;
  if(!h)return;
  const sec=h.closest('.sec-label'),card=h.closest('[data-acc]');
  if(!sec||!card)return;
  e.preventDefault();
  dragP={gid:sec.dataset.gid,acc:card.dataset.acc,target:null};
  sec.classList.add('dragging');
});
view.addEventListener('pointermove',e=>{
  if(!dragP)return;
  document.querySelectorAll('.dropcue').forEach(x=>x.classList.remove('dropcue'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const sec=el&&el.closest?el.closest('.sec-label'):null;
  const card=el&&el.closest?el.closest('[data-acc]'):null;
  if(sec&&card&&card.dataset.acc===dragP.acc&&sec.dataset.gid!==dragP.gid){
    sec.classList.add('dropcue');
    dragP.target=sec.dataset.gid;
    const r=sec.getBoundingClientRect();
    dragP.before=e.clientY<r.top+r.height/2;
  }else dragP.target=null;
});
function endDragP(){
  if(!dragP)return;
  document.querySelectorAll('.dropcue').forEach(x=>x.classList.remove('dropcue'));
  document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
  if(dragP.target){moveGroup(S.activeMonth,dragP.acc,dragP.gid,dragP.target,dragP.before);save();render();}
  dragP=null;
}
view.addEventListener('pointerup',endDragP);
view.addEventListener('pointercancel',endDragP);

view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  const m=S.months[S.activeMonth];
  const keys=monthKeys(),ix=keys.indexOf(S.activeMonth);

  if(act==='mprev'&&ix>0){S.activeMonth=keys[ix-1];save();render();return;}
  if(act==='mnext'&&ix<keys.length-1){S.activeMonth=keys[ix+1];save();render();return;}
  if(act==='newmonth'){newMonth();return;}

  if(act==='addacc'){
    const name=prompt('Nome da nova conta:');if(!name)return;
    const id=uid();S.accounts.push({id,name,cash:false});
    for(const k of monthKeys()){S.months[k].openings[id]=0;
      S.months[k].groups.push({id:uid(),acc:id,name:'Entradas',type:'in'},{id:uid(),acc:id,name:'Saídas',type:'out'});}
    save();render();return;
  }

  const accEl=e.target.closest('[data-acc]');
  if(act==='cashflag'&&accEl){const a=S.accounts.find(x=>x.id===accEl.dataset.acc);a.cash=!a.cash;save();render();return;}
  if(act==='accdel'&&accEl){
    const aid=accEl.dataset.acc;const a=S.accounts.find(x=>x.id===aid);
    if(S.accounts.length<=1){alert('Não dá pra excluir a última conta.');return;}
    if(!confirm(`Excluir a conta "${a.name}"?\n\nIsso apaga a conta, seus grupos e TODOS os itens dela em TODOS os meses. Não dá pra desfazer — na dúvida, faça antes um backup na aba Ferramentas.`))return;
    S.accounts=S.accounts.filter(x=>x.id!==aid);
    const fb=S.accounts[0].id; // cartões e dívidas que apontavam pra conta excluída
    for(const c of S.cards)if(c.account===aid)c.account=fb;
    for(const d of S.debts)if(d.account===aid){d.account=fb;d.budget=false;}
    for(const k of monthKeys()){
      const m=S.months[k];
      const gids=m.groups.filter(g=>g.acc===aid).map(g=>g.id);
      m.groups=m.groups.filter(g=>g.acc!==aid);
      m.items=m.items.filter(i=>!gids.includes(i.g));
      delete m.openings[aid];
      if(m.real)delete m.real[aid];
      m.transfers=m.transfers.filter(tr=>tr.from!==aid&&tr.to!==aid);
    }
    save();render();return;
  }
  if((act==='gaddin'||act==='gaddout')&&accEl){
    m.groups.push({id:uid(),acc:accEl.dataset.acc,name:act==='gaddin'?'Novo grupo (entrada)':'Novo grupo (saída)',type:act==='gaddin'?'in':'out'});
    save();render();return;
  }
  const gEl=e.target.closest('[data-gid]');
  if(act==='gcol'&&gEl){const g=m.groups.find(x=>x.id===gEl.dataset.gid);g.col=!g.col;save();render();return;}
  if(act==='gdel'&&gEl){
    const gid=gEl.dataset.gid;const n=m.items.filter(i=>i.g===gid).length;
    if(n&&!confirm(`Remover este grupo e seus ${n} itens?`))return;
    m.groups=m.groups.filter(g=>g.id!==gid);m.items=m.items.filter(i=>i.g!==gid);
    save();render();return;
  }
  if(act==='iadd'&&gEl){
    const gid=gEl.dataset.gid;
    const li=gEl.querySelector('[data-role="nlabel"]'),vi=gEl.querySelector('[data-role="nval"]');
    const label=(li.value||'').trim(),val=mask(vi.value);
    if(!label){li.focus();return;}
    const it={id:uid(),g:gid,label,val,recurring:false,paid:false,person:'',tags:[]};
    const gg=m.groups.find(x=>x.id===gid); // modo captura: só SAÍDAS nascem vinculadas (entrada capturada taggearia um salário por acidente)
    if(S.focusProj&&gg&&gg.type==='out'&&projAtivos().some(p=>p.id===S.focusProj)){it.proj=S.focusProj;projReach(projById(S.focusProj),S.activeMonth);}
    m.items.push(it);
    save();render();return;
  }

  const itEl=e.target.closest('[data-id]');
  if(itEl){
    const id=itEl.dataset.id;
    if(act==='paid'){const it=findItem(id);it.paid=!it.paid;save();render();return;}
    if(act==='rec'){const it=findItem(id);it.recurring=!it.recurring;save();render();return;}
    if(act==='more'){itTrayId===id?closeItemTray():openItemTray(id,b);return;}
    if(act==='idel'){
      const it0=findItem(id);
      if(it0&&it0.debtId){
        const d=S.debts.find(x=>x.id===it0.debtId);
        if(d){if(!confirm(`Este item é a parcela automática de "${d.name}". Excluir aqui desliga o lançamento dela no orçamento (em todos os meses). Continuar?`))return;
          d.budget=false;for(const k of monthKeys())syncDebtItems(k);save();render();return;}
      }
      const ix=m.items.findIndex(i=>i.id===id);
      if(ix>=0){lastDeleted={kind:'item',mk:S.activeMonth,idx:ix,obj:m.items[ix]};undoToast(`"${m.items[ix].label}" excluído`);}
      m.items=m.items.filter(i=>i.id!==id);save();render();return;}
    if(act==='tdone'){const t=findTransfer(id);t.done=!t.done;save();render();return;}
    if(act==='trec'){const t=findTransfer(id);t.rec=!t.rec;save();render();return;}
    if(act==='tdel'){
      const ix=m.transfers.findIndex(t=>t.id===id);
      if(ix>=0){lastDeleted={kind:'transfer',mk:S.activeMonth,idx:ix,obj:m.transfers[ix]};undoToast('Transferência excluída');}
      m.transfers=m.transfers.filter(t=>t.id!==id);save();render();return;}
    /* dívidas */
    if(act==='ddel'){if(!confirm('Remover esta dívida?'))return;
      S.debts=S.debts.filter(d=>d.id!==id);
      for(const k of monthKeys())S.months[k].items=S.months[k].items.filter(i=>i.debtId!==id);
      save();render();return;}
    if(act==='dcard'){const d=S.debts.find(x=>x.id===id);const k=b.dataset.card;d.card=(d.card===k)?null:k;save();render();return;}
    if(act==='dlink'){
      const d=S.debts.find(x=>x.id===id);
      if(!d.budget){
        const sel=itEl.querySelector('[data-act="dlink_acc"]');
        d.account=(sel&&sel.value)||d.account||S.accounts[0].id;
        d.budget=true;
      }else d.budget=false;
      for(const k of monthKeys())syncDebtItems(k);
      save();render();return;
    }
    if(act==='dpill'){const d=S.debts.find(x=>x.id===id);const n=+b.dataset.n;d.pagas=(n===d.pagas)?n-1:n;save();render();return;}
  }
  if(act==='taddgo'){
    const from=document.getElementById('nt_from').value,to=document.getElementById('nt_to').value;
    const val=mask(document.getElementById('nt_val').value);
    if(from===to||!val)return;
    m.transfers.push({id:uid(),from,to,val,done:false});save();render();return;
  }
  /* cartões */
  const cardEl=e.target.closest('[data-cardid]');
  if(act==='card_add'){S.cards.push({id:uid(),name:'Novo cartão',brand:null,account:S.accounts[0].id});save();render();return;}
  if(act==='card_del'&&cardEl){
    const cid=cardEl.dataset.cardid;const card=S.cards.find(c=>c.id===cid);
    if(!confirm(`Excluir o cartão "${card.name}"?\n\nOs gastos dele em todos os meses serão apagados; itens de fatura vinculados viram itens manuais (mantêm o último valor).`))return;
    S.cards=S.cards.filter(c=>c.id!==cid);
    for(const k of monthKeys()){const m=S.months[k];
      if(Array.isArray(m.cardExp))m.cardExp=m.cardExp.filter(x=>x.cardId!==cid);
      for(const it of m.items)if(it.cardId===cid)delete it.cardId;}
    save();render();return;
  }
  if(act==='card_brand'&&cardEl){
    const card=S.cards.find(c=>c.id===cardEl.dataset.cardid);
    card.brand=(card.brand===b.dataset.card)?null:b.dataset.card;
    save();render();return;
  }
  if(act==='card_link'&&cardEl){
    const card=S.cards.find(c=>c.id===cardEl.dataset.cardid);
    if(!S.accounts.some(a=>a.id===card.account))card.account=S.accounts[0].id; // conta do cartão não existe mais
    linkCardToMonths(card,S.activeMonth);
    save();render();return;
  }
  if(act==='card_unlink'&&cardEl){
    const card=S.cards.find(c=>c.id===cardEl.dataset.cardid);
    if(!confirm(`Desvincular a fatura de "${card.name}"?\n\nO item automático some deste mês e dos futuros; meses passados ficam como estão.`))return;
    for(const k of monthKeys()){
      if(monthIdx(k)<monthIdx(S.activeMonth))continue;
      S.months[k].items=S.months[k].items.filter(i=>i.cardId!==card.id);
    }
    save();render();return;
  }
  if(act==='ce_tray'){const row=e.target.closest('.row[data-id]');if(row)openCeTray(row.dataset.id,b);return;}
  if(act==='fixpaid'){const ck=S.months[todayKey()]?todayKey():monthKeys().slice(-1)[0];const it=(S.months[ck].items||[]).find(x=>x.id===b.dataset.id);if(it)it.paid=!it.paid;save();render();return;} // marca pago/recebido no mês atual (não afeta outros meses)
  if(act==='fixstop'){const ck=S.months[todayKey()]?todayKey():monthKeys().slice(-1)[0];stopRecurring(ck,b.dataset.id);return;}
  if(act==='ce_add'&&cardEl){
    const li=cardEl.querySelector('[data-role="ce_nlabel"]'),vi=cardEl.querySelector('[data-role="ce_nval"]');
    const label=(li.value||'').trim(),val=mask(vi.value);
    if(!label){li.focus();return;}
    const x={id:uid(),cardId:cardEl.dataset.cardid,label,val,cat:undefined};
    if(S.focusProj&&projAtivos().some(p=>p.id===S.focusProj)){x.proj=S.focusProj;projReach(projById(S.focusProj),S.activeMonth);} // modo captura
    ce(S.activeMonth).push(x);
    syncCardItems(S.activeMonth);save();render();return;
  }
  if(act==='dquickadd'){
    const name=(document.getElementById('qd_name').value||'').trim();
    const val=mask(document.getElementById('qd_val').value);
    const st=(document.getElementById('qd_st').value||'').trim();
    if(!name){document.getElementById('qd_name').focus();return;}
    let total=1,pagas=0;
    const mm=st.match(/^(\d+)\s*\/\s*(\d+)$/);
    if(mm){total=Math.max(1,+mm[2]);pagas=Math.min(total,Math.max(0,+mm[1]-1));}
    else if(/^\d+$/.test(st)){total=Math.max(1,+st);}
    S.debts.push({id:uid(),name,parcela:val,total,pagas});save();render();return;
  }
  if(act==='dtile'){const ix=+b.dataset.ix;selTile=(selTile===ix)?null:ix;render();return;}
  /* caixinhas */
  if(act==='cxadd'){
    const inp=document.getElementById('cx_name');const n=(inp.value||'').trim();
    if(!n){inp.focus();return;}
    const PAL=['#7ee787','#79c0ff','#ffa657','#d2a8ff','#ff7b72','#f0883e','#a5d6ff','#ffd33d'];
    S.savings.push({id:uid(),name:n,color:PAL[S.savings.length%PAL.length],balance:0,target:0,deadline:null});
    save();render();return;
  }
  const cxDelEl=e.target.closest('[data-cxid]');
  if(act==='cxdel'&&cxDelEl){
    const c=S.savings.find(x=>x.id===cxDelEl.dataset.cxid);
    if(!confirm(`Excluir a caixinha "${c?c.name:''}"?\n\nO valor deixa de ficar reservado — o dinheiro nas suas contas não muda.`))return;
    S.savings=S.savings.filter(x=>x.id!==cxDelEl.dataset.cxid);
    save();render();return;
  }
  /* projetos */
  if(act==='pjadd'){
    const inp=document.getElementById('pj_name');const n=(inp.value||'').trim();
    if(!n){inp.focus();return;}
    S.projects.push({id:uid(),name:n,color:CATPAL[S.projects.length%CATPAL.length],budget:0,deadline:null,start:todayKey(),end:null,plan:[],notes:''});
    save();render();return;
  }
  if(act==='pjshowclosed'){projShowClosed=!projShowClosed;render();return;}
  if(act==='pjuntag'){ // desvincular: só remove a etiqueta — o lançamento continua intacto na aba de origem
    const mk2=b.dataset.mk,src=b.dataset.src,mm=S.months[mk2];if(!mm)return;
    const list=src==='item'?mm.items:(mm.cardExp||[]);
    const x=list.find(z=>z.id===b.dataset.xid);if(!x||!x.proj)return;
    lastDeleted={kind:'destag',mk:mk2,src,objId:x.id,proj:x.proj};
    undoToast(`"${x.label}" desvinculado do projeto`);
    delete x.proj;save();render();return;
  }
  const pjEl=e.target.closest('[data-pjid]');
  if(act==='pjclose'&&pjEl){
    const p=projById(pjEl.dataset.pjid);if(!p)return;
    const f=projFlow(p),n=Object.keys(f.byMonth).length;
    let maior=null;for(const k in f.byMonth)if(!maior||f.byMonth[k]>f.byMonth[maior])maior=k;
    const pctTxt=p.budget>0?Math.round(f.real/p.budget*100)+'% do orçamento':'sem orçamento';
    if(!confirm(`Encerrar "${p.name}"?\n\n${p.name}: R$ ${fmt(f.real)} em ${n||1} ${n===1?'mês':'meses'} · ${pctTxt}${maior?' · maior mês: '+mlabel(maior):''}.\n\nEle some dos seletores e desce pra ENCERRADOS — dá pra reabrir quando quiser.`))return;
    // encerrar = só marcar o fim: projFlow ignora meses > end, então vínculos futuros (recorrentes já clonados) apenas param de contar.
    // NÃO apagar os proj do futuro — senão reabrir seria lossy (perderia a projeção). O guard do spawnMonth impede que meses NOVOS herdem.
    p.end=p.start>todayKey()?p.start:todayKey();
    if(S.focusProj===p.id)S.focusProj=null;
    save();render();return;
  }
  if(act==='pjreopen'&&pjEl){const p=projById(pjEl.dataset.pjid);if(p){p.end=null;save();render();}return;}
  if(act==='pjpadd'&&pjEl){
    const p=projById(pjEl.dataset.pjid);if(!p)return;
    const li=pjEl.querySelector('[data-role="pjp_nlabel"]'),vi=pjEl.querySelector('[data-role="pjp_nval"]');
    const label=(li.value||'').trim(),val=Math.max(0,mask(vi.value));
    if(!label){li.focus();return;}
    p.plan.push({id:uid(),label,val,done:false,via:''});
    save();render();return;
  }
  if(act==='pjpdel'&&pjEl){
    const p=projById(pjEl.dataset.pjid),plEl=e.target.closest('[data-plid]');if(!p||!plEl)return;
    const ix=p.plan.findIndex(x=>x.id===plEl.dataset.plid);if(ix<0)return;
    lastDeleted={kind:'plan',pjid:p.id,idx:ix,obj:p.plan[ix]};
    undoToast(`"${p.plan[ix].label}" removido do plano`);
    p.plan.splice(ix,1);save();render();return;
  }
  if(act==='pjspawn'&&pjEl){
    const plEl=e.target.closest('[data-plid]');if(!plEl)return;
    openSpTray(pjEl.dataset.pjid,plEl.dataset.plid,b);return;
  }
  if(act==='pjfocus'&&pjEl){
    const p=projById(pjEl.dataset.pjid);if(!p||p.end)return;
    S.focusProj=S.focusProj===p.id?null:p.id;save();render();return;
  }
  if(act==='pjdel'&&pjEl){
    const p=projById(pjEl.dataset.pjid);if(!p)return;
    let n=0;for(const k of monthKeys()){const mm=S.months[k];
      for(const it of mm.items)if(it.proj===p.id)n++;
      for(const x of (mm.cardExp||[]))if(x.proj===p.id)n++;}
    if(!confirm(`Apagar o projeto "${p.name}"?\n\n${n?`Isso desmarca ${n} lançamento${n>1?'s':''} — os gastos continuam nos meses, só perdem a etiqueta. `:''}Não dá pra desfazer (pra guardar o retrato, use Encerrar).`))return;
    for(const k of monthKeys()){const mm=S.months[k];
      for(const it of mm.items)if(it.proj===p.id)delete it.proj;
      for(const x of (mm.cardExp||[]))if(x.proj===p.id)delete x.proj;}
    S.projects=S.projects.filter(x=>x.id!==p.id);
    if(S.focusProj===p.id)S.focusProj=null;
    save();render();return;
  }
  /* dashboard */
  if(act==='dashproj'){dashProj=!dashProj;render();return;}
  if(act==='dashhist'){dashHist=!dashHist;render();return;}
  if(act==='dashtable'){dashTable=!dashTable;render();return;}
  if(act==='notetog'){const k=b.dataset.key;openNotes.has(k)?openNotes.delete(k):openNotes.add(k);render();return;}
  /* backup */
  if(act==='bkdown'){
    S.lastBackup=Date.now();save();
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='sistema-financeiro-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();return;
  }
  if(act==='bkcopy'){
    S.lastBackup=Date.now();save();
    navigator.clipboard.writeText(JSON.stringify(S)).then(()=>{
      document.getElementById('bkmsg').textContent='JSON copiado para a área de transferência.';});return;
  }
  if(act==='gobackup'){S.tab='backup';save();render();return;}
  if(act==='settheme'){applyTheme(b.dataset.t);render();return;}
  if(act==='xlpreset'){
    xlPreset=b.dataset.p;
    if(xlPreset==='custom'){const avail=xlAvailMonths();if(!xlFrom)xlFrom=avail[0];if(!xlTo)xlTo=avail[avail.length-1];}
    render();return;
  }
  if(act==='xldown'){
    const months=xlMonthsInRange();if(!months.length)return;
    const bytes=xlBuildWorkbook(months);
    const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`sistema-financeiro-planilha-${months[0]}_a_${months[months.length-1]}.xlsx`;a.click();
    return;
  }
  if(act==='dismissfresh'){freshBoot=false;render();return;}
  if(act==='catadd'){
    const inp=document.getElementById('cat_new');const n=(inp.value||'').trim();
    if(!n){inp.focus();return;}
    if(!S.categories.includes(n)){S.categories.push(n);if(!S.catColors[n])S.catColors[n]=CATPAL[(S.categories.length-1)%CATPAL.length];}
    save();render();return;
  }
  if(act==='catdel'){
    S.categories=S.categories.filter(c=>c!==b.dataset.name);
    delete S.catColors[b.dataset.name];
    save();render();return;
  }
  if(act==='brandadd'){
    const inp=document.getElementById('brand_new');const n=(inp.value||'').trim();
    if(!n){inp.focus();return;}
    const PAL=['#7ee787','#f0883e','#79c0ff','#ffa657','#d2a8ff','#ff7b72','#a5d6ff','#ffd33d'];
    S.brands.push({id:uid(),name:n,color:PAL[S.brands.length%PAL.length]});
    save();render();return;
  }
  if(act==='branddel'){
    const id=b.dataset.id,br=brandById(id);
    if(!confirm(`Remover a bandeira "${br?br.name:id}"?\n\nAs dívidas e cartões que a usavam ficam sem bandeira (as parcelas saem das faturas).`))return;
    S.brands=S.brands.filter(x=>x.id!==id);
    for(const d of S.debts)if(d.card===id)d.card=null;
    for(const c of S.cards)if(c.brand===id)c.brand=null;
    for(const k of monthKeys())syncCardItems(k);
    save();render();return;
  }
  if(act==='bkimp'){document.getElementById('bkfile').click();return;}
  if(act==='bkpaste'){bkPasteOpen=!bkPasteOpen;render();return;}
  if(act==='bkpastego'){
    const ta=document.getElementById('bkpastearea');
    const txt=(ta&&ta.value||'').trim();
    if(!txt){if(ta)ta.focus();return;}
    bkPasteOpen=false;
    const res=importState(txt);
    if(!res.ok)bkPasteOpen=true; // erro sem re-render: mantém a área aberta pro usuário corrigir
    const msgEl=document.getElementById('bkmsg');
    if(msgEl)msgEl.innerHTML=esc(res.msg)+(res.ok?' <button class="bk" data-act="bkundo" style="padding:5px 12px;font-size:10px">↩ Desfazer importação</button>':'');
    return;
  }
  if(act==='bkundo'){
    let prev=null;try{prev=localStorage.getItem(KEY+'_prev');}catch(e){}
    const msgEl0=document.getElementById('bkmsg');
    if(!prev){if(msgEl0)msgEl0.textContent='Nada para desfazer.';return;}
    const res=importState(prev); // importState guarda o estado de agora em _prev → desfazer de novo re-troca
    const msgEl=document.getElementById('bkmsg');
    if(msgEl)msgEl.innerHTML=res.ok?'Estado anterior restaurado. <button class="bk" data-act="bkundo" style="padding:5px 12px;font-size:10px">↩ Trocar de volta</button>':esc(res.msg);
    return;
  }
  if(act==='bkreset'){
    if(!confirm(`Tem certeza disso?\n\nIsso apaga TODOS os meses, contas, itens e dívidas deste navegador e recomeça do zero em ${mlabel(todayKey())}.`))return;
    const t=prompt('Confirmação final: digite ZERAR (em maiúsculas) para apagar tudo.\n\nDica: faça um backup antes, na mesma aba.');
    if(t!=='ZERAR'){document.getElementById('bkmsg').textContent='Cancelado — nada foi apagado.';return;}
    try{localStorage.setItem(KEY+'_prev',JSON.stringify(S));}catch(e){} // rede de segurança
    localStorage.removeItem(KEY);S=seed();S.tab='backup';save();render();
    const msgEl=document.getElementById('bkmsg');
    if(msgEl)msgEl.innerHTML='Tudo zerado. <button class="bk" data-act="bkundo" style="padding:5px 12px;font-size:10px">↩ Desfazer</button>';
    return;
  }
});

view.addEventListener('input',e=>{
  const el=e.target,act=el.dataset.act;if(!act)return;
  const m=S.months[S.activeMonth];
  const wrap=el.closest('[data-id]'),accEl=el.closest('[data-acc]');
  if(act==='ival'&&wrap){const it=findItem(wrap.dataset.id);it.val=mask(el.value);el.value=fmt(it.val);el.dataset.raw=it.val;save();updateTotals();return;}
  if(act==='tval'&&wrap){const t=findTransfer(wrap.dataset.id);t.val=mask(el.value);el.value=fmt(t.val);el.dataset.raw=t.val;save();updateTotals();return;}
  if(act==='ce_val'&&wrap){const x=ce(S.activeMonth).find(z=>z.id===wrap.dataset.id);if(x){x.val=mask(el.value);el.value=(x.est?'+ ':'')+fmt(x.val);el.dataset.raw=x.val;syncCardItems(S.activeMonth);save();}return;}
  if(act==='opening'&&accEl){m.openings[accEl.dataset.acc]=mask(el.value);el.value=fmt(m.openings[accEl.dataset.acc]);el.dataset.raw=m.openings[accEl.dataset.acc];m.auto=false;save();updateTotals();return;}
  if(act==='real'&&accEl){
    const digits=el.value.replace(/\D/g,'');
    if(!digits){delete m.real[accEl.dataset.acc];el.value='';el.dataset.raw='';}
    else{m.real[accEl.dataset.acc]=mask(el.value);el.value=fmt(m.real[accEl.dataset.acc]);el.dataset.raw=m.real[accEl.dataset.acc];}
    save();updateTotals();return;
  }
  if(act==='dparcela'&&wrap){const d=S.debts.find(x=>x.id===wrap.dataset.id);d.parcela=mask(el.value);el.value=fmt(d.parcela);el.dataset.raw=d.parcela;save();return;}
  const cxEl=el.closest('[data-cxid]');
  if((act==='cxbal'||act==='cxtarget')&&cxEl){
    const c=S.savings.find(x=>x.id===cxEl.dataset.cxid);
    if(c){const v=Math.max(0,mask(el.value));el.value=fmt(v);el.dataset.raw=v;if(act==='cxbal')c.balance=v;else c.target=v;save();}
    return;
  }
  const pjEl=el.closest('[data-pjid]');
  if(act==='pjbudget'&&pjEl){
    const p=projById(pjEl.dataset.pjid);
    if(p){const v=Math.max(0,mask(el.value));el.value=fmt(v);el.dataset.raw=v;p.budget=v;save();}
    return;
  }
  if(act==='pjnotes'&&pjEl){const p=projById(pjEl.dataset.pjid);if(p){p.notes=el.value;save();}return;}
  if(act==='pjpval'&&pjEl){
    const p=projById(pjEl.dataset.pjid),plEl=el.closest('[data-plid]');
    const pl=p&&plEl?p.plan.find(x=>x.id===plEl.dataset.plid):null;
    if(pl&&!pl.done){const v=Math.max(0,mask(el.value));el.value=fmt(v);el.dataset.raw=v;pl.val=v;save();}
    return;
  }
});

/* compactação dos valores grandes nos inputs: ≥1mi mostra "1,2mi" em repouso; ao focar expande pro número cheio (fmt, editável),
   ao sair recompacta (fmtc). guarda em ≥1mi pra não tocar na digitação de valores normais (fmtc===fmt abaixo de 1mi). */
view.addEventListener('focusin',e=>{const el=e.target;if(!el.dataset||el.dataset.raw===undefined||el.dataset.raw==='')return;const n=+el.dataset.raw;if(Math.abs(n)>=1e6)el.value=(el.dataset.pfx||'')+fmt(n);});
view.addEventListener('focusout',e=>{const el=e.target;if(!el.dataset||el.dataset.raw===undefined||el.dataset.raw==='')return;const n=+el.dataset.raw;if(Math.abs(n)>=1e6)el.value=(el.dataset.pfx||'')+fmtc(n);});

view.addEventListener('change',e=>{
  const el=e.target,act=el.dataset.act;if(!act)return;
  const m=S.months[S.activeMonth];
  const wrap=el.closest('[data-id]'),accEl=el.closest('[data-acc]'),gEl=el.closest('[data-gid]');
  if(act==='iname'&&wrap){findItem(wrap.dataset.id).label=el.value.trim()||'item';save();return;}
  if(act==='gname'&&gEl){m.groups.find(g=>g.id===gEl.dataset.gid).name=el.value.trim()||'grupo';save();return;}
  if(act==='accname'&&accEl){S.accounts.find(a=>a.id===accEl.dataset.acc).name=el.value.trim()||'conta';save();render();return;}
  // origem===destino nunca: escolher a conta do outro lado inverte a direção (swap). O select vizinho é atualizado
  // IN-PLACE (sem render(): iOS dispara change durante a roleta do picker e um render mataria o select no meio do gesto)
  if(act==='tfrom'&&wrap){const t=findTransfer(wrap.dataset.id);if(el.value===t.to){t.to=t.from;const o=wrap.querySelector('[data-act="tto"]');if(o)o.value=t.to;}t.from=el.value;save();updateTotals();return;}
  if(act==='tto'&&wrap){const t=findTransfer(wrap.dataset.id);if(el.value===t.from){t.from=t.to;const o=wrap.querySelector('[data-act="tfrom"]');if(o)o.value=t.from;}t.to=el.value;save();updateTotals();return;}
  if(act==='dname'&&wrap){S.debts.find(x=>x.id===wrap.dataset.id).name=el.value.trim()||'dívida';save();return;}
  if(act==='ce_name'&&wrap){const x=ce(S.activeMonth).find(z=>z.id===wrap.dataset.id);if(x)x.label=el.value.trim()||'gasto';save();return;}
  if(act==='ce_cat'&&wrap){
    const x=ce(S.activeMonth).find(z=>z.id===wrap.dataset.id);if(!x)return;
    if(el.value==='__new'){const n=askNewCat();if(n)x.cat=n;save();render();return;}
    x.cat=el.value||undefined;save();return;
  }
  const cardEl2=el.closest('[data-cardid]');
  if(act==='card_name'&&cardEl2){S.cards.find(c=>c.id===cardEl2.dataset.cardid).name=el.value.trim()||'cartão';save();render();return;}
  if(act==='card_acc'&&cardEl2){S.cards.find(c=>c.id===cardEl2.dataset.cardid).account=el.value;save();return;}
  if(act==='brandname'){const br=brandById(el.dataset.id);if(br)br.name=el.value.trim()||'bandeira';save();render();return;}
  if(act==='brandcolor'){const br=brandById(el.dataset.id);if(br)br.color=el.value;save();render();return;}
  if(act==='xlfrom'){xlFrom=el.value;xlRefreshRange();return;}
  if(act==='xlto'){xlTo=el.value;xlRefreshRange();return;}
  if(act==='catren'){ // renomear categoria propaga pro histórico inteiro (itens, gastos de cartão, dívidas)
    const old=el.dataset.old,nu=el.value.trim();
    if(!nu||nu===old){render();return;}
    const i=S.categories.indexOf(old);
    if(i>=0){
      if(S.categories.includes(nu))S.categories.splice(i,1); // já existe: funde as duas
      else S.categories[i]=nu;
    }
    if(!S.catColors[nu]&&S.catColors[old])S.catColors[nu]=S.catColors[old]; // leva a cor junto (mantém a do destino se fundiu)
    if(old!==nu)delete S.catColors[old];
    for(const k of monthKeys()){const mm=S.months[k];
      for(const it of mm.items)if(it.cat===old)it.cat=nu;
      for(const x of (mm.cardExp||[]))if(x.cat===old)x.cat=nu;
    }
    for(const d of S.debts)if(d.cat===old)d.cat=nu;
    save();render();return;
  }
  if(act==='catcolor'){S.catColors[el.dataset.old]=el.value;save();render();return;}
  if(act==='dashcatfocus'){dashCatFocus=el.value||null;render();return;} // foco de categoria na dash (volátil)
  if(act==='dlink_acc'&&wrap){
    const d=S.debts.find(x=>x.id===wrap.dataset.id);
    d.account=el.value;
    if(d.budget)for(const k of monthKeys())syncDebtItems(k);
    save();return;
  }
  if(act==='dcat'&&wrap){
    const d=S.debts.find(x=>x.id===wrap.dataset.id);
    if(el.value==='__new'){const n=askNewCat();if(n)d.cat=n;save();render();return;}
    d.cat=el.value||undefined;save();render();return;
  }
  if(act==='dtotal'&&wrap){const d=S.debts.find(x=>x.id===wrap.dataset.id);
    d.total=Math.max(1,parseInt(el.value.replace(/\D/g,'')||'1',10));
    if(d.pagas>d.total)d.pagas=d.total;save();render();return;}
  if(act==='datual'&&wrap){const d=S.debts.find(x=>x.id===wrap.dataset.id);
    const n=Math.min(d.total,Math.max(1,parseInt(el.value.replace(/\D/g,'')||'1',10)));
    d.pagas=n-1;save();render();return;}
  const cxEl=el.closest('[data-cxid]');
  if(cxEl){
    const c=S.savings.find(x=>x.id===cxEl.dataset.cxid);
    if(!c)return;
    if(act==='cxname'){c.name=el.value.trim()||'caixinha';save();render();return;}
    if(act==='cxcolor'){c.color=el.value;save();render();return;}
    if(act==='cxdeadline'){c.deadline=el.value||null;save();render();return;}
    if(act==='cxbal'||act==='cxtarget'){render();return;} // recalcula barra/livre/ritmo ao sair do campo
  }
  const pjEl2=el.closest('[data-pjid]');
  if(pjEl2){
    const p=projById(pjEl2.dataset.pjid);
    if(!p)return;
    if(act==='pjname'){p.name=el.value.trim()||'projeto';save();render();return;}
    if(act==='pjcolor'){p.color=el.value;save();render();return;}
    if(act==='pjdeadline'){p.deadline=el.value||null;save();render();return;}
    if(act==='pjbudget'||act==='pjpval'){render();return;} // recalcula barra/segmento fantasma ao sair do campo (valor já salvo no input)
    if(act==='pjplabel'){const plEl=el.closest('[data-plid]');const pl=plEl?p.plan.find(x=>x.id===plEl.dataset.plid):null;
      if(pl&&!pl.done)pl.label=el.value.trim()||'item';save();return;}
  }
});

/* enter adiciona item na linha de novo item */
view.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const gEl=e.target.closest('.addrow[data-gid]');
  if(gEl){gEl.querySelector('[data-act="iadd"]').click();return;}
  if(e.target.closest('#qd_row')){const btn=document.querySelector('[data-act="dquickadd"]');if(btn)btn.click();return;}
  if(e.target.closest('#cx_row')){const btn=document.querySelector('[data-act="cxadd"]');if(btn)btn.click();return;}
  if(e.target.closest('#pj_row')){const btn=document.querySelector('[data-act="pjadd"]');if(btn)btn.click();return;}
  const pjc=e.target.closest('[data-pjid]');
  if(pjc&&e.target.closest('.addrow')){const btn=pjc.querySelector('[data-act="pjpadd"]');if(btn)btn.click();return;}
  const cEl=e.target.closest('[data-cardid]');
  if(cEl&&e.target.closest('.addrow')){const btn=cEl.querySelector('[data-act="ce_add"]');if(btn)btn.click();}
});

window.addEventListener('storage',e=>{ // outra aba deste arquivo gravou: adota o estado dela em vez de sobrescrever depois
  if(e.key!==KEY||!e.newValue)return;
  try{const s=JSON.parse(e.newValue);if(s&&s.v===1){S=s;migrate();render();}}catch(_){}
});

save();render();
